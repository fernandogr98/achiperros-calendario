name: Actualizar calendario

on:
  schedule:
    - cron: "17 * * * *"     # cada hora
  workflow_dispatch:          # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scraper.py
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      # Marca diaria: mantiene el repo con actividad para que GitHub no pause el cron tras 60 días
      - run: date -u +%F > docs/last_check.txt
      - name: Commit si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add docs competitions_cache.json
          git diff --cached --quiet || git commit -m "Actualiza calendario $(date -u +'%F %H:%M')"
          git push
